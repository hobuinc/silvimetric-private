name: Private CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  AWS_DEFAULT_REGION: us-west-2
  # The bucket is intentionally stable; every integration-test database is
  # isolated below a commit- and run-specific prefix.
  SILVIMETRIC_TEST_S3_BUCKET: silvimetric

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # uuid4() in the fixture supplies the final component, allowing matrix
      # jobs and retries to coexist while keeping cleanup scoped.
      SILVIMETRIC_TEST_S3_PREFIX: test_silvimetric/ci/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12', '3.14']
    steps:
      - name: Checkout source and LFS fixtures
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create Conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          environment-file: environment.yml
          environment-name: silvimetric
          create-args: python=${{ matrix.python-version }}

      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-click awscli
          python -m pip install .

      - name: Report test environment
        run: |
          python --version
          python -m pip list
          micromamba list

      - name: Report S3 integration-test capability
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SILVIMETRIC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SILVIMETRIC_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "S3 integration credential found; remote shatter test will use s3://${SILVIMETRIC_TEST_S3_BUCKET}/${SILVIMETRIC_TEST_S3_PREFIX}/<uuid>."
          else
            echo "::notice::No SILVIMETRIC_ACCESS_KEY_ID/SILVIMETRIC_SECRET_ACCESS_KEY secrets are configured; the credential-gated S3 integration test will be skipped."
          fi

      - name: Run full test suite
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SILVIMETRIC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SILVIMETRIC_SECRET_ACCESS_KEY }}
        run: python -m pytest -vv --durations=25

  fusion-gridmetrics:
    name: GridMetrics CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GridMetrics
        run: cmake -S vendor/fusion -B build/fusion-gridmetrics -DCMAKE_BUILD_TYPE=Release

      - name: Build GridMetrics
        run: cmake --build build/fusion-gridmetrics --parallel

      - name: Run GridMetrics CTest smoke test
        run: ctest --test-dir build/fusion-gridmetrics --output-on-failure
